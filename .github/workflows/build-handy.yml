# Compila Handy (cjpais/Handy) para macOS Apple Silicon desde un tag auditado.
# Sin secretos, firma ad-hoc, sin artefactos del updater.
# Coloca este fichero en .github/workflows/build-handy.yml de un repo PÚBLICO tuyo.

name: Build Handy (self, unsigned)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag o commit de cjpais/Handy"
        required: true
        default: "v0.9.7"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-26            # Xcode 26 completo: necesario para el puente Swift de Apple Intelligence
    timeout-minutes: 120
    env:
      HANDY_REF: ${{ inputs.ref || 'v0.9.7' }}
      AUDITED_REF: v0.9.7
      AUDITED_SHA: 05e0aedd2906f0d82722735f930465950c476b90

    steps:
      - name: Checkout cjpais/Handy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: cjpais/Handy
          ref: ${{ env.HANDY_REF }}
          persist-credentials: false

      - name: Verificar commit auditado
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          echo "Compilando $HANDY_REF -> $HEAD_SHA"
          if [ "$HANDY_REF" = "$AUDITED_REF" ] && [ "$HEAD_SHA" != "$AUDITED_SHA" ]; then
            echo "::error::El tag $AUDITED_REF no apunta al commit auditado ($AUDITED_SHA). Abortando."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin
          rustc --version && cargo --version && xcodebuild -version

      - name: Dependencias frontend (lockfile estricto)
        run: bun install --frozen-lockfile

      - name: Build
        run: |
          bun run tauri build \
            --target aarch64-apple-darwin \
            --bundles app,dmg \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Checksums
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          shasum -a 256 *.dmg | tee SHA256SUMS.txt
          echo "commit: $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" >> SHA256SUMS.txt

      - name: Subir artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: handy-${{ env.HANDY_REF }}-macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
